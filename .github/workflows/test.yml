name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest yfinance
      - run: pytest -q
      - name: Verify drawdown circuit breaker and trade cooldown
        run: |
          python - <<'PY'
          from ai_trading_agent.engine import TradingEngine
          import inspect
          params = inspect.signature(TradingEngine).parameters
          assert "drawdown_halt" in params
          assert "trade_cooldown_bars" in params
          assert params["drawdown_halt"].default == 0.12
          assert params["drawdown_recovery"].default == 0.04
          assert params["trade_cooldown_bars"].default == 3
          print("Risk protections: 12% drawdown halt + 4% recovery + 3-bar cooldown")
          PY
      - run: python -m ai_trading_agent.main --data sample_prices.csv --cash 10000
      - run: python -m ai_trading_agent.paper_loop --data sample_prices.csv
      - name: Run 1000 EUR backtest
        run: |
          python - <<'PY'
          from ai_trading_agent.backtest import format_metrics, load_candles, run_backtest
          metrics = run_backtest(load_candles('sample_prices.csv'), starting_cash=1000.0)
          print(format_metrics(metrics))
          PY
      - name: Run multi-regime robustness backtest
        run: python stress_backtest.py
      - name: Run realistic 100-run stress backtest
        run: python realistic_stress_backtest.py
      - name: Run real-market historical paper backtest
        run: python real_market_backtest.py
      - name: Run no-lookahead robust validation
        run: python robust_validation.py
      - name: Run 1000 EUR OOS portfolio validation
        run: python portfolio_validation.py
      - name: Run recent intraday public-market paper replay
        run: python live_market_replay.py
