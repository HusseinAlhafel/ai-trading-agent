[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-agent"
version = "0.1.0"
description = "Safe paper-trading AI-style signal agent; no live trading support."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paper-trader = "ai_trading_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
