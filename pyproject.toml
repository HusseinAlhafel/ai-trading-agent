[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-agent"
version = "0.3.0"
description = "Safe market-data signal advisor and paper-trading AI-style agent; no live trading support."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paper-trader = "ai_trading_agent.main:main"
paper-replay = "ai_trading_agent.paper_loop:main"
market-signal = "ai_trading_agent.live_signal:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
